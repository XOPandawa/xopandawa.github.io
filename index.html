<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0C0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maintenance">
<title>Maintenance</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="config.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0B0C0E; color: #E8E8E8; font-family: -apple-system, system-ui, Segoe UI, Roboto, sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #0B0C0E; }
  #bar { position: fixed; left: 8px; right: 8px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 9; display: none;
         background: #16181C; border: 2px solid #FF6B00; border-radius: 10px; padding: 10px 12px; box-shadow: 0 6px 24px #000a; }
  #bar.show { display: flex; gap: 10px; align-items: center; }
  #bar .txt { flex: 1; font-size: 14px; line-height: 1.3; }
  #bar .txt b { display: block; font-size: 15px; color: #FF6B00; text-transform: uppercase; letter-spacing: .5px; }
  #bar button { font: inherit; font-weight: 700; border: 0; border-radius: 8px; padding: 10px 12px; }
  #on { background: #FF6B00; color: #0B0C0E; text-transform: uppercase; }
  #x { background: transparent; color: #888; font-size: 18px; padding: 6px 8px; }
  #setup { display: none; padding: 32px 20px; font-size: 16px; line-height: 1.5; }
  #setup code { background: #222; padding: 2px 6px; border-radius: 4px; color: #FF6B00; }
</style>
</head>
<body>
<div id="setup">
  <h2 style="color:#FF6B00">⚙ Not set up yet</h2>
  <p>Open <code>config.js</code> and paste your Web app URL (ends with <code>/exec</code>) and your OneSignal App ID. Then upload it again.</p>
</div>
<iframe id="app" title="Maintenance" allow="camera; geolocation; clipboard-write" style="display:none"></iframe>

<div id="bar" role="dialog" aria-live="polite">
  <div class="txt" id="msg"></div>
  <button id="on" type="button"></button>
  <button id="x" type="button" aria-label="Later">✕</button>
</div>

<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script>
(function () {
  var cfg = window.APP_CONFIG || {};
  var ready = cfg.appUrl && /\/exec\/?$/.test(cfg.appUrl);
  var pushReady = cfg.oneSignalAppId && !/PASTE/.test(cfg.oneSignalAppId);
  var id = (navigator.language || '').toLowerCase().indexOf('id') === 0;
  var T = id ? {
    title: '🔔 Notifikasi', body: 'Dapat tugas & persetujuan langsung di HP.', on: 'Aktifkan',
    iosTitle: '📲 Pasang dulu', iosBody: 'Tekan ⬆ Bagikan → “Tambah ke Layar Utama”, lalu buka dari ikon.', iosOn: 'OK',
    off: 'Notifikasi diblokir. Buka Pengaturan → Notifikasi → izinkan.'
  } : {
    title: '🔔 Notifications', body: 'Get jobs and approvals straight to your phone.', on: 'Turn on',
    iosTitle: '📲 Install first', iosBody: 'Tap ⬆ Share → “Add to Home Screen”, then open it from the icon.', iosOn: 'OK',
    off: 'Notifications are blocked. Open Settings → Notifications → allow.'
  };
  if (cfg.name) document.title = cfg.name;

  if (!ready) { document.getElementById('setup').style.display = 'block'; return; }
  var frame = document.getElementById('app');
  frame.src = cfg.appUrl.replace(/\/$/, '') + location.search;
  frame.style.display = 'block';

  var bar = document.getElementById('bar'), msg = document.getElementById('msg'), on = document.getElementById('on');
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var standalone = window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } }
  function show(title, body, btn, fn) { msg.innerHTML = '<b>' + title + '</b>' + body; on.textContent = btn; on.onclick = fn; bar.classList.add('show'); }
  function hide() { bar.classList.remove('show'); }
  document.getElementById('x').onclick = function () { store('hm_bar_later', String(Date.now())); hide(); };
  function snoozed() { var t = +store('hm_bar_later') || 0; return Date.now() - t < 3 * 864e5; }

  // Messages from the maintenance app inside the frame: who is logged in.
  var pending = store('hm_push_id');
  window.addEventListener('message', function (e) {
    var host = '';
    try { host = new URL(e.origin).hostname; } catch (err) { return; }
    if (!/(^|\.)googleusercontent\.com$/.test(host) && host !== 'script.google.com') return;
    var d = e.data || {};
    if (d.type === 'hm-login' && d.id) { pending = String(d.id); store('hm_push_id', pending); withOS(function (OS) { OS.login(pending); }); offer(); }
    if (d.type === 'hm-logout') { pending = null; store('hm_push_id', null); withOS(function (OS) { OS.logout(); }); }
  });

  if (!pushReady) return;
  if (!('Notification' in window) || !('serviceWorker' in navigator)) {
    if (isIOS && !standalone && !snoozed()) show(T.iosTitle, T.iosBody, T.iosOn, hide);
    return;
  }

  var base = location.pathname.replace(/[^/]*$/, '');
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  var queue = [];
  function withOS(fn) { if (window.__OS) return fn(window.__OS); queue.push(fn); }
  OneSignalDeferred.push(async function (OS) {
    await OS.init({
      appId: cfg.oneSignalAppId,
      serviceWorkerPath: base.slice(1) + 'OneSignalSDKWorker.js',
      serviceWorkerParam: { scope: base },
      allowLocalhostAsSecureOrigin: true,
      notifyButton: { enable: false },
      promptOptions: { slidedown: { prompts: [] } }
    });
    window.__OS = OS;
    if (pending) OS.login(pending);
    queue.splice(0).forEach(function (fn) { try { fn(OS); } catch (e) {} });
    OS.Notifications.addEventListener('permissionChange', function (ok) { if (ok) hide(); });
    offer();
  });

  function offer() {
    if (!window.__OS || !pending) return;          // ask only after someone has logged in
    var perm = Notification.permission;
    if (perm === 'granted') return hide();
    if (snoozed()) return;
    if (perm === 'denied') return show(T.title, T.off, 'OK', hide);
    show(T.title, T.body, T.on, function () {
      window.__OS.Notifications.requestPermission().then(hide, hide);  // must run from this tap (iPhone rule)
    });
  }
})();
</script>
</body>
</html>
